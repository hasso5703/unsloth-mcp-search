[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unsloth-mcp-search"
version = "0.1.0"
description = "MCP server exposing Unsloth Studio's web_search tool (DuckDuckGo + URL fetch with HTML→Markdown)"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [{ name = "Hasan" }]
dependencies = [
  # mcp 2.x removed `mcp.server.fastmcp`, which server.py imports.
  "mcp[cli]>=1.0.0,<2",
  "ddgs>=9.0.0",
  # PDF text extraction. Upstream uses Studio's RAG parser (pymupdf, ~50 MB);
  # pypdf is pure Python and text-only, which is all this server needs.
  "pypdf>=5.0.0",
]

[project.scripts]
unsloth-mcp-search = "unsloth_mcp_search.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/unsloth_mcp_search"]
